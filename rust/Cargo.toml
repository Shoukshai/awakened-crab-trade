[package]
name = "awakened-poe-trade-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Rust migration of Awakened PoE Trade"

[dependencies]
gtk = "0.18"
glib = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
x11rb = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[profile.release]
lto = "thin"
strip = true
