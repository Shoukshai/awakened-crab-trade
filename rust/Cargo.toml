[package]
name = "awakened-crab-trade"
version = "0.35.3"
edition = "2021"
license = "MIT"
description = "Native Path of Exile price checker for Linux and Windows"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
unicode-normalization = "0.1.25"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
gtk = "0.18"
glib = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", optional = true, features = ["Media_Ocr", "Globalization", "Graphics_Imaging", "Graphics_Capture", "Graphics_DirectX_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_System_WinRT_Direct3D11", "Win32_Graphics_Dwm", "Storage_Streams", "Win32_System_WinRT", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Accessibility", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Cryptography"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = "0.13"

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1", features = ["time"] }
wayland-scanner = "0.31"

[profile.release]
lto = "thin"
strip = true

[features]
cloud-ocr = ["dep:windows", "windows-sys/Win32_System_JobObjects"]
windows-test-fixture = []

[[bin]]
name = "apt-win32-fixture"
path = "src/windows_fixture.rs"
required-features = ["windows-test-fixture"]
