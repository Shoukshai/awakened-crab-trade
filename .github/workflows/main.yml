name: Native checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libgtk-layer-shell-dev libx11-dev libxtst-dev libxrandr-dev libxi-dev libxfixes-dev
      - name: Check README character set
        run: python3 -c "from pathlib import Path; Path('README.md').read_bytes().decode('ascii')"
      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --check
      - name: Test native core
        run: cargo test --locked --manifest-path rust/Cargo.toml --bin awakened-crab-trade
      - name: Check native code
        run: cargo clippy --locked --manifest-path rust/Cargo.toml --bin awakened-crab-trade -- -D warnings
